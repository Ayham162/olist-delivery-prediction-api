name: CI

on:
  push:
  pull_request:

env:
  # models/, data/, and notebooks/artifacts/03_test.csv are DVC-tracked, not
  # committed to git (see TASK3_CHECKLIST.md §4) — a plain checkout doesn't
  # have them. The DVC remote used for local dev (../dvc-storage) is a local
  # folder, unreachable from GitHub's runners; a real deployment would `dvc
  # pull` from a cloud-backed remote (S3/GCS) using credentials in repo
  # secrets, which needs cloud infrastructure not provisioned for this
  # exercise. This release asset is the honest stand-in: same artifacts,
  # fetched over plain HTTPS instead of a `dvc pull` we can't authenticate.
  CI_FIXTURES_URL: https://github.com/${{ github.repository }}/releases/download/ci-fixtures-v1/ci-artifacts.tar.gz

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: black --check app src tests scripts
      - run: isort --check-only app src tests scripts
      - run: flake8 app src tests scripts

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pip install --no-deps -e .
      - name: Fetch model/data artifacts
        run: curl -fL "$CI_FIXTURES_URL" | tar -xz
      - run: pytest

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    # write access to GHCR - only actually used on a push (see the push step's
    # own `if`); a pull_request's default GITHUB_TOKEN is read-only anyway,
    # so this permission is a no-op there, not a security gap.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch model/data artifacts
        run: curl -fL "$CI_FIXTURES_URL" | tar -xz
      - name: Build image
        run: |
          docker build \
            -t ghcr.io/ayham162/olist-delivery-prediction-api:latest \
            -t ghcr.io/ayham162/olist-delivery-prediction-api:${{ github.sha }} \
            .
      # Push only on an actual push to this repo (never on a pull_request -
      # PRs from forks get a read-only GITHUB_TOKEN, and pushing an image
      # built from an unreviewed PR would be bad practice regardless).
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.event_name == 'push'
        run: docker push ghcr.io/ayham162/olist-delivery-prediction-api --all-tags
